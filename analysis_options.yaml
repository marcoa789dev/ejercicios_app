# Reglas de análisis estricto (Very Good Analysis). Ejecutar con `flutter analyze`.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - lib/firebase_options_*.dart

linter:
  rules:
    # App privada: no se exige documentar cada miembro público.
    public_member_api_docs: false
